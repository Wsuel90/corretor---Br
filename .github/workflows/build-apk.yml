
name: Build Corretor BR Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          mkdir -p /tmp/CorretorBRKeyboard
          unzip -q CorretorBR-Keyboard.zip -d /tmp/CorretorBRKeyboard
          ls -la /tmp/CorretorBRKeyboard

      - name: Compilar APK
        run: |
          gradle -p /tmp/CorretorBRKeyboard assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CorretorBR-Keyboard
          path: /tmp/CorretorBRKeyboard/app/build/outputs/apk/debug/app-debug.apk
          
